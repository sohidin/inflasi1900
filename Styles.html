<style>
  :root {
    --bg: #f4f7fb;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --primary: #0b5cab;
    --primary-dark: #073b72;
    --primary-soft: #eaf3ff;
    --accent: #16a085;
    --text: #162033;
    --muted: #6b778c;
    --border: #dde5ef;
    --danger: #d64545;
    --danger-soft: #fff0f0;
    --success: #198754;
    --success-soft: #eaf8f1;
    --warning: #e8a317;
    --shadow: 0 14px 35px rgba(29, 53, 87, .10);
    --radius: 18px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
  button, input, select { font: inherit; }
  button { cursor: pointer; }
  .hidden { display: none !important; }

  .login-page {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 28px;
    overflow: hidden;
    position: relative;
    background:
      radial-gradient(circle at 15% 20%, rgba(38, 132, 255, .22), transparent 28%),
      radial-gradient(circle at 85% 80%, rgba(22, 160, 133, .18), transparent 30%),
      linear-gradient(135deg, #062e59, #0b5cab 52%, #0e7490);
  }
  .login-decoration { position: absolute; border: 1px solid rgba(255,255,255,.16); border-radius: 50%; }
  .decoration-one { width: 420px; height: 420px; left: -150px; bottom: -160px; }
  .decoration-two { width: 540px; height: 540px; right: -200px; top: -250px; }
  .login-card {
    width: min(440px, 100%);
    padding: 36px;
    background: rgba(255,255,255,.96);
    border: 1px solid rgba(255,255,255,.55);
    box-shadow: 0 30px 80px rgba(0,0,0,.28);
    border-radius: 26px;
    position: relative;
    z-index: 2;
    backdrop-filter: blur(12px);
  }
  .brand-mark { width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; font-weight: 900; letter-spacing: -2px; color: #fff; background: linear-gradient(135deg, var(--primary), #14a0c3); box-shadow: 0 10px 24px rgba(11,92,171,.25); }
  .brand-mark.small { width: 44px; height: 44px; border-radius: 13px; font-size: 14px; }
  .login-heading { margin: 24px 0 28px; }
  .eyebrow { margin: 0 0 5px; color: var(--primary); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; font-weight: 800; }
  .login-heading h1 { margin: 0 0 10px; font-size: 30px; line-height: 1.15; }
  .login-heading p:last-child { color: var(--muted); line-height: 1.6; margin: 0; }
  .login-form { display: grid; gap: 18px; }
  .login-form label > span { display: block; font-size: 13px; font-weight: 750; margin-bottom: 7px; }
  .input-wrap { display: flex; align-items: center; border: 1px solid var(--border); background: #fff; border-radius: 13px; padding: 0 13px; transition: .2s; }
  .input-wrap:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(11,92,171,.11); }
  .input-wrap input { width: 100%; border: 0; outline: 0; padding: 13px 10px; background: transparent; }
  .input-icon { opacity: .65; }
  .password-toggle { border: 0; background: transparent; padding: 7px; }
  .primary-button { border: 0; border-radius: 13px; padding: 14px 18px; background: linear-gradient(135deg, var(--primary), #0d7fc0); color: #fff; font-weight: 800; display: flex; justify-content: center; gap: 12px; align-items: center; box-shadow: 0 10px 25px rgba(11,92,171,.24); }
  .primary-button:hover { transform: translateY(-1px); filter: brightness(1.03); }
  .primary-button:disabled { opacity: .65; cursor: wait; }
  .full-width { width: 100%; }
  .form-error { min-height: 18px; margin: -6px 0 0; color: var(--danger); font-size: 13px; text-align: center; }
  .login-footer { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; text-align: center; }

  .app-shell { min-height: 100vh; display: flex; }
  .sidebar { width: 270px; position: fixed; inset: 0 auto 0 0; z-index: 20; display: flex; flex-direction: column; padding: 20px 16px; color: #fff; background: linear-gradient(180deg, #062e59 0%, #073f76 56%, #062e59 100%); box-shadow: 8px 0 30px rgba(15,42,70,.14); transition: transform .25s ease; }
  .sidebar-brand { display: flex; gap: 12px; align-items: center; padding: 3px 6px 22px; border-bottom: 1px solid rgba(255,255,255,.13); }
  .sidebar-brand strong, .sidebar-brand span { display: block; }
  .sidebar-brand span { margin-top: 3px; color: rgba(255,255,255,.63); font-size: 11px; }
  .nav-menu { flex: 1; margin-top: 18px; overflow-y: auto; padding-right: 3px; }
  .nav-section { padding: 16px 12px 6px; color: rgba(255,255,255,.45); font-size: 10px; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; }
  .nav-item { width: 100%; display: flex; gap: 12px; align-items: center; margin: 3px 0; padding: 11px 13px; border: 0; border-radius: 12px; color: rgba(255,255,255,.76); background: transparent; text-align: left; transition: .18s; }
  .nav-item b { font-size: 13px; font-weight: 650; }
  .nav-item span { width: 21px; font-size: 18px; text-align: center; }
  .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
  .nav-item.active { color: #fff; background: linear-gradient(135deg, rgba(63,157,255,.40), rgba(38,205,179,.22)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.10); }
  .sidebar-bottom { border-top: 1px solid rgba(255,255,255,.13); padding-top: 14px; }
  .condition-mini { padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.08); }
  .condition-mini span, .condition-mini strong { display: block; }
  .condition-mini span { color: rgba(255,255,255,.55); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
  .condition-mini strong { margin-top: 4px; font-size: 12px; line-height: 1.4; }
  .logout-button { width: 100%; margin-top: 9px; padding: 10px; color: #fff; border: 1px solid rgba(255,255,255,.16); border-radius: 11px; background: transparent; }
  .logout-button:hover { background: rgba(255,255,255,.08); }

  .main-area { min-width: 0; flex: 1; margin-left: 270px; }
  .topbar { height: 86px; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 0 28px; border-bottom: 1px solid rgba(221,229,239,.9); background: rgba(255,255,255,.91); backdrop-filter: blur(14px); }
  .topbar h2 { margin: 0; font-size: 22px; }
  .topbar-actions { margin-left: auto; display: flex; gap: 12px; align-items: center; }
  .condition-badge { max-width: 320px; padding: 8px 13px; border: 1px solid #cfe1f7; border-radius: 12px; background: var(--primary-soft); }
  .condition-badge span, .condition-badge strong { display: block; }
  .condition-badge span { color: var(--primary); font-size: 9px; font-weight: 850; text-transform: uppercase; letter-spacing: .12em; }
  .condition-badge strong { margin-top: 2px; color: var(--primary-dark); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-button { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 12px; color: var(--text); background: #fff; font-size: 20px; }
  .icon-button:hover { border-color: #b9cbe1; background: var(--surface-soft); }
  .menu-toggle { display: none; }

  .content-area { padding: 26px; }
  .hero-card { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 27px; border-radius: var(--radius); color: #fff; background: linear-gradient(120deg, #0b5cab, #087b9e 65%, #159579); box-shadow: var(--shadow); overflow: hidden; position: relative; }
  .hero-card::after { content: ''; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px; border: 35px solid rgba(255,255,255,.08); border-radius: 50%; }
  .hero-card h3 { margin: 3px 0 8px; font-size: 27px; position: relative; z-index: 1; }
  .hero-card p { margin: 0; color: rgba(255,255,255,.78); position: relative; z-index: 1; }
  .hero-condition { min-width: 230px; padding: 16px 18px; border: 1px solid rgba(255,255,255,.18); border-radius: 15px; background: rgba(255,255,255,.12); position: relative; z-index: 1; }
  .hero-condition span, .hero-condition strong { display: block; }
  .hero-condition span { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: rgba(255,255,255,.7); }
  .hero-condition strong { margin-top: 5px; font-size: 17px; }

  .stats-grid { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 16px; margin: 20px 0; }
  .stat-card, .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(35,61,89,.055); }
  .stat-card { padding: 19px; }
  .stat-card .stat-label { color: var(--muted); font-size: 12px; }
  .stat-card strong { display: block; margin-top: 7px; font-size: 28px; }
  .stat-card small { color: var(--muted); }
  .panel { padding: 22px; margin-bottom: 20px; }
  .panel-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 17px; }
  .panel-header h3 { margin: 0 0 5px; font-size: 18px; }
  .panel-header p { margin: 0; color: var(--muted); font-size: 13px; }
  .section-heading { margin: 26px 0 14px; }
  .section-heading h3 { margin: 0 0 4px; }
  .section-heading p { margin: 0; color: var(--muted); font-size: 13px; }

  .region-chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .region-chip { padding: 11px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-soft); }
  .region-chip strong, .region-chip span { display: block; }
  .region-chip strong { color: var(--primary); font-size: 13px; }
  .region-chip span { margin-top: 2px; color: var(--muted); font-size: 11px; }

  .table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { padding: 11px 12px; border-bottom: 1px solid #e9eef5; font-size: 12px; text-align: left; white-space: nowrap; }
  th { position: sticky; top: 0; z-index: 1; color: #fff; background: #0b5cab; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  tbody tr:hover { background: #f7fbff; }
  tbody tr:last-child td { border-bottom: 0; }
  td.number, th.number { text-align: right; font-variant-numeric: tabular-nums; }
  td.center, th.center { text-align: center; }
  td.positive { color: #b83434; }
  td.negative { color: #087c58; }
  .value-max { color: var(--danger); font-weight: 900; background: var(--danger-soft); }
  .value-min { color: var(--success); font-weight: 900; background: var(--success-soft); }
  .empty-cell { color: #a1adba; }

  .rank-section { margin-bottom: 30px; }
  .rank-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px; }
  .rank-card { min-width: 0; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 22px rgba(34,62,90,.05); overflow: hidden; }
  .rank-card-header { padding: 16px 17px; border-bottom: 1px solid var(--border); background: var(--surface-soft); }
  .rank-card-header strong { display: block; font-size: 14px; }
  .rank-card-header span { color: var(--muted); font-size: 11px; }
  .rank-card .table-wrap { border: 0; border-radius: 0; }
  .rank-high .rank-card-header { border-left: 5px solid var(--danger); }
  .rank-low .rank-card-header { border-left: 5px solid var(--success); }

  .settings-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 750; }
  .form-control { width: 100%; padding: 12px 13px; border: 1px solid var(--border); border-radius: 12px; outline: 0; background: #fff; }
  .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(11,92,171,.1); }
  .info-list { display: grid; gap: 12px; }
  .info-row { display: flex; justify-content: space-between; gap: 16px; padding-bottom: 11px; border-bottom: 1px solid var(--border); }
  .info-row span { color: var(--muted); font-size: 12px; }
  .info-row strong { font-size: 12px; text-align: right; }
  .note-box { margin-top: 16px; padding: 13px; border-radius: 12px; color: #725200; background: #fff8df; border: 1px solid #f1df9f; font-size: 12px; line-height: 1.55; }

  .loading-overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--primary-dark); background: rgba(244,247,251,.78); backdrop-filter: blur(4px); }
  .spinner { width: 42px; height: 42px; border: 4px solid #cfe0f2; border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast-container { position: fixed; z-index: 200; right: 22px; top: 22px; display: grid; gap: 10px; }
  .toast { min-width: 280px; max-width: 390px; padding: 13px 15px; border-radius: 13px; color: #fff; box-shadow: 0 15px 38px rgba(0,0,0,.18); animation: toastIn .25s ease; }
  .toast.success { background: #167c59; }
  .toast.error { background: #bd3f3f; }
  @keyframes toastIn { from { transform: translateY(-8px); opacity: 0; } }
  .empty-state { padding: 42px 20px; text-align: center; color: var(--muted); }

  @media (max-width: 1150px) {
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main-area { margin-left: 0; }
    .menu-toggle { display: grid; }
    .rank-grid, .settings-grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 620px) {
    .login-card { padding: 26px 22px; }
    .topbar { height: auto; min-height: 78px; padding: 14px 16px; }
    .topbar .eyebrow { display: none; }
    .topbar h2 { font-size: 18px; }
    .condition-badge { max-width: 150px; }
    .content-area { padding: 16px; }
    .hero-card { align-items: flex-start; flex-direction: column; padding: 21px; }
    .hero-condition { width: 100%; min-width: 0; }
    .stats-grid { grid-template-columns: 1fr; }
    .panel { padding: 16px; }
    .toast-container { left: 15px; right: 15px; }
    .toast { min-width: 0; width: 100%; }
  }

  .condition-change-button {
    min-height: 42px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 0 14px;
    border: 1px solid #b9d3ef;
    border-radius: 12px;
    color: var(--primary-dark);
    background: #ffffff;
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
    transition: .2s ease;
  }

  .condition-change-button:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-soft);
    transform: translateY(-1px);
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 150;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(8, 27, 48, .55);
    backdrop-filter: blur(5px);
  }

  .modal-card {
    width: min(480px, 100%);
    padding: 24px;
    border: 1px solid rgba(255, 255, 255, .65);
    border-radius: 20px;
    background: #ffffff;
    box-shadow: 0 30px 80px rgba(8, 27, 48, .28);
    animation: modalIn .2s ease;
  }

  .modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }

  .modal-header h3 {
    margin: 0;
    font-size: 21px;
  }

  .modal-close-button {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    border: 1px solid var(--border);
    border-radius: 11px;
    color: var(--muted);
    background: #ffffff;
    font-size: 25px;
    line-height: 1;
  }

  .modal-close-button:hover {
    color: var(--danger);
    border-color: #efbcbc;
    background: var(--danger-soft);
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 22px;
  }

  .secondary-button {
    min-height: 45px;
    padding: 0 18px;
    border: 1px solid var(--border);
    border-radius: 13px;
    color: var(--text);
    background: #ffffff;
    font-weight: 750;
  }

  .secondary-button:hover {
    background: var(--surface-soft);
  }

  .form-help {
    margin: -5px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.5;
  }

  input[type="datetime-local"] {
    min-height: 47px;
    cursor: pointer;
  }

  @keyframes modalIn {
    from {
      opacity: 0;
      transform: translateY(10px) scale(.98);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @media (max-width: 760px) {
    .condition-change-button {
      width: 42px;
      padding: 0;
      overflow: hidden;
      font-size: 0;
    }

    .condition-change-button::before {
      content: "🗓";
      font-size: 18px;
    }

    .modal-actions {
      flex-direction: column-reverse;
    }

    .modal-actions button {
      width: 100%;
    }
  }


  .table-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 14px;
  }

  .search-box {
    width: min(430px, 100%);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #fff;
  }

  .search-box span { color: var(--muted); font-size: 20px; }
  .search-box input {
    width: 100%;
    padding: 11px 0;
    border: 0;
    outline: 0;
    background: transparent;
  }

  .excel-button {
    min-height: 42px;
    padding: 0 15px;
    border: 1px solid #afd9c8;
    border-radius: 12px;
    color: #0d6849;
    background: #effaf5;
    font-weight: 800;
    white-space: nowrap;
  }

  .excel-button:hover { background: #ddf4e9; border-color: #71bd9d; }

  .table-wrap {
    overflow: auto;
    scrollbar-gutter: stable;
  }

  .tall-table { max-height: calc(100vh - 270px); min-height: 260px; }
  .rank-table-wrap { max-height: none; }

  .interactive-table thead th {
    position: sticky;
    top: 0;
    z-index: 4;
    box-shadow: 0 1px 0 rgba(255,255,255,.2), 0 2px 6px rgba(0,0,0,.10);
  }

  th.sortable { cursor: pointer; user-select: none; padding-right: 25px; position: sticky; }
  th.sortable::after { content: '⇅'; position: absolute; right: 8px; opacity: .55; }
  th.sortable.sort-asc::after { content: '↑'; opacity: 1; }
  th.sortable.sort-desc::after { content: '↓'; opacity: 1; }

  tr.filtered-out,
  tr.local-filtered-out,
  tr.global-filtered-out {
    display: none;
  }

  .global-region-hidden {
    display: none !important;
  }

  .compact-panel { margin-bottom: 16px; }
  .region-rank-section { margin-bottom: 24px; }
  .region-rank-heading { margin: 0 0 10px; padding: 0 4px; }
  .region-rank-heading h3 { margin: 0 0 3px; font-size: 18px; }
  .region-rank-heading p { margin: 0; color: var(--muted); font-size: 12px; }

  .rank-pair-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .rank-card .table-toolbar { padding: 12px 14px 0; margin-bottom: 10px; }
  .rank-card .search-box { width: 100%; }

  @media (max-width: 1080px) {
    .topbar-actions .condition-change-button { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
  }

  @media (max-width: 900px) {
    .rank-pair-grid { grid-template-columns: 1fr; }
    .tall-table { max-height: 65vh; }
  }

  @media (max-width: 620px) {
    .table-toolbar { align-items: stretch; flex-direction: column; }
    .search-box, .excel-button { width: 100%; }
    #downloadAllButton { display: none; }
  }

  /* Tabel komoditas: nama panjang dibungkus maksimal dua baris. */
  .rank-table-wrap {
    max-height: none;
    overflow-x: hidden;
    overflow-y: visible;
    scrollbar-gutter: auto;
  }

  .rank-data-table {
    width: 100%;
    min-width: 0;
    table-layout: fixed;
  }

  .rank-data-table th,
  .rank-data-table td {
    white-space: normal;
    vertical-align: middle;
  }

  .rank-data-table .rank-no-column,
  .rank-data-table tbody td:first-child {
    width: 9%;
  }

  .rank-data-table .rank-code-column,
  .rank-data-table .rank-code-cell {
    width: 18%;
  }

  .rank-data-table .rank-name-column,
  .rank-data-table .rank-name-cell {
    width: 55%;
  }

  .rank-data-table .rank-value-column,
  .rank-data-table .rank-value-cell {
    width: 18%;
  }

  .rank-name-cell span {
    display: -webkit-box;
    overflow: hidden;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    line-height: 1.35;
    max-height: 2.7em;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .rank-code-cell,
  .rank-value-cell {
    white-space: nowrap !important;
  }

  .rank-data-table tbody tr {
    height: 52px;
  }

  @media (max-width: 620px) {
    .rank-data-table .rank-no-column,
    .rank-data-table tbody td:first-child { width: 10%; }
    .rank-data-table .rank-code-column,
    .rank-data-table .rank-code-cell { width: 21%; }
    .rank-data-table .rank-name-column,
